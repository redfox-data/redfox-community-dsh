# DSH bundle profile patch.
# Makes the plugin installable AND active via:
#   dsh plugin --profile web add github:redfox-data/redfox-community-dsh
# `id`   = the Cordis plugin id (see `export const name` in index.mjs)
# `name` = the npm package name (resolved from node_modules after install)
- insert:
    # 112 个红狐社区 Skills（FileSystemSkillProvider 挂载 bundledSkillDir）
    - id: redfox-community-dsh
      name: 'redfox-community-dsh'
    # RedFoxHub 数据 API 的 40 个 MCP 工具（stdio 拉起 uvx redfox-mcp）
    - id: mcp-redfox
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: redfox
        transport: stdio
        command: uvx
        args: ['redfox-mcp']
        env:
          # 取宿主进程环境变量；未配置时传空串，工具会返回结构化的获取引导
          REDFOX_API_KEY: !!js process.env.REDFOX_API_KEY ?? ''
        # 视频生成等异步任务内部轮询最长 480s，放宽默认 60s 的调用超时
        toolCallTimeoutMs: 540000
